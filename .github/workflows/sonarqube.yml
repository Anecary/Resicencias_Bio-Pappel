name: SonarQube .NET Framework Analysis

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Install .NET SDK for SonarScanner
        shell: powershell
        run: |
          $dotnetDir = "${{ runner.temp }}\dotnet"

          New-Item -ItemType Directory -Force -Path $dotnetDir

          Invoke-WebRequest `
            -Uri https://dot.net/v1/dotnet-install.ps1 `
            -OutFile "${{ runner.temp }}\dotnet-install.ps1"

          & "${{ runner.temp }}\dotnet-install.ps1" `
            -Channel 8.0 `
            -InstallDir $dotnetDir

          echo "$dotnetDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "DOTNET_ROOT=$dotnetDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify .NET
        shell: powershell
        run: |
          dotnet --version
          dotnet --info

      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: |
            ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Verify MSBuild
        shell: powershell
        run: |
          $msbuild = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"

          if (!(Test-Path $msbuild)) {
            throw "MSBuild was not found at $msbuild"
          }

          & $msbuild -version

      - name: Build and analyze
        shell: powershell
        run: |
          $scanner = "${{ runner.temp }}\scanner\dotnet-sonarscanner"
          $msbuild = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"

          & $scanner begin `
            /k:"bioppapel_test1" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}"

          & $msbuild ".\Proyecto_Residencias_Bio-Pappel.sln" `
            /t:Rebuild `
            /p:Configuration=Debug

          & $scanner end `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
