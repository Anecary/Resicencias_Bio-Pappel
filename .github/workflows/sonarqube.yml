name: SonarQube .NET Framework Analysis

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: self-hosted

    steps:
      # 1. Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      # 2. Java requerido por SonarScanner
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      # 3. Instalar .NET SDK para poder ejecutar dotnet-sonarscanner
      - name: Install .NET SDK for SonarScanner
        shell: powershell
        run: |
          $dotnetDir = "${{ runner.temp }}\dotnet"

          New-Item -ItemType Directory -Force -Path $dotnetDir

          Invoke-WebRequest `
            -Uri https://dot.net/v1/dotnet-install.ps1 `
            -OutFile "${{ runner.temp }}\dotnet-install.ps1"

          & "${{ runner.temp }}\dotnet-install.ps1" `
            -Channel 8.0 `
            -InstallDir $dotnetDir

          echo "$dotnetDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "DOTNET_ROOT=$dotnetDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 4. Verificar .NET
      - name: Verify .NET
        shell: powershell
        run: |
          dotnet --version
          dotnet --info

      # 5. Configurar NuGet
      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: 'latest'

      # 6. Restaurar dependencias del proyecto
      - name: Restore NuGet packages
        shell: powershell
        run: |
          nuget restore ".\Proyecto_Residencias_Bio-Pappel.sln" -NonInteractive

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet restore failed with exit code $LASTEXITCODE"
          }

      # 7. Instalar SonarScanner
      - name: Install SonarQube scanner
        shell: powershell
        run: |
          $scannerDir = "${{ runner.temp }}\scanner"

          New-Item -Path $scannerDir -ItemType Directory -Force

          dotnet tool update dotnet-sonarscanner `
            --tool-path $scannerDir

          if ($LASTEXITCODE -ne 0) {
            throw "SonarScanner installation failed with exit code $LASTEXITCODE"
          }

      # 8. Verificar MSBuild
      - name: Verify MSBuild
        shell: powershell
        run: |
          $msbuild = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"

          if (!(Test-Path $msbuild)) {
            throw "MSBuild was not found at $msbuild"
          }

          & $msbuild -version

      # 9. Ejecutar análisis SonarQube y compilar la solución
      - name: Build and analyze
        shell: powershell
        run: |
          $scanner = "${{ runner.temp }}\scanner\dotnet-sonarscanner"
          $msbuild = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"

          # Iniciar análisis
          & $scanner begin `
            /k:"bioppapel_test1" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}"

          if ($LASTEXITCODE -ne 0) {
            throw "SonarScanner begin failed with exit code $LASTEXITCODE"
          }

          # Compilar solución completa
          & $msbuild ".\Proyecto_Residencias_Bio-Pappel.sln" `
            /t:Rebuild `
            /p:Configuration=Debug

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

          # Finalizar análisis y enviar resultados a SonarQube
          & $scanner end `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

          if ($LASTEXITCODE -ne 0) {
            throw "SonarScanner end failed with exit code $LASTEXITCODE"
          }
